services:
  postgres:
    image: postgres:17

    container_name: documind_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind123
      POSTGRES_DB: documind

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: