[project]
name = "documind-ai-backend"
version = "0.1.0"
description = "Backend for DocuMind AI"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<5.0",
    "python-multipart>=0.0.32",
    "pgvector>=0.5.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "sentence-transformers>=5.6.0",
    "ollama>=0.6.2",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
    "email-validator>=2.2.0",
    "requests>=2.34.2",
]
