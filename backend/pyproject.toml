[project]
name = "documind-ai-backend"
version = "0.1.0"
description = "Backend for DocuMind AI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bcrypt>=4.0,<5.0",
    "ollama>=0.6.2",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.5.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.6.0",
]
