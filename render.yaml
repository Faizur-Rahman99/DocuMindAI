services:
  - type: web
    name: documind-backend
    runtime: python
    rootDir: backend

    buildCommand: |
      pip install uv
      uv sync
      alembic upgrade head

    startCommand: |
      uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        sync: false

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60

      - key: OLLAMA_BASE_URL
        value: http://localhost:11434

      - key: OLLAMA_MODEL
        value: llama3.2:3b