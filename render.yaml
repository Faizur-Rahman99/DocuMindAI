services:
  - type: web
    name: documind-backend
    runtime: python
    rootDir: backend

    buildCommand: |
      pip install uv
      uv sync
      alembic upgrade head

    startCommand: |
      uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        sync: false

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
